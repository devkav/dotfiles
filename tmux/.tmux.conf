# Set the default terminal to support 256 colors
set-option -g default-terminal "tmux-256color"
set-option -g default-shell "/bin/bash"
set-option -g default-command bash

# Enable true color support (24-bit colors)
set-option -ga terminal-overrides ",*256col*:Tc"
set-option -ga terminal-overrides ",xterm-kitty:Tc"
set-option -ga terminal-overrides ",alacritty:Tc"

# Additional color and cursor support
set-option -ga terminal-overrides ",*:Ss=\\E[%p1%d q:Se=\\E[2 q"

set -g status-position bottom
set -g status-left-length 30
set -g status-justify centre

# Window/tab styling
set -g window-status-separator ' | '
set -g window-status-format ' #I:#W '
set -g window-status-current-format ' #I:#W '
set -g window-status-current-style 'bg=black,fg=white,bold'
set -g window-status-style 'bg=default,fg=black'

# sane scrolling:
set -g mouse on
bind -n WheelUpPane if-shell -F -t = "#{mouse_any_flag}" "send-keys -M" "if -Ft= '#{pane_in_mode}' 'send-keys -M' 'copy-mode -e; send-keys -M'"

# Plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum settings
set -g @continuum-restore 'on'
set -g @continuum-save-interval '15'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
